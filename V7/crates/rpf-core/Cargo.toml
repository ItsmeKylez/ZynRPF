[package]
name = "rpf-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "RPF7 archive parser and rebuilder with strict limits; RSC7/YPT code copied from the original Zyn-RPF core (GPL-3.0)."

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga"] }
fast_image_resize = { version = "6", features = ["image"] }
intel_tex_2 = "0.5"
bcdec_rs = "0.2"
texpresso = { version = "2", features = ["rayon"] }
rage-formats = "0.2"
