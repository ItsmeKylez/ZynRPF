<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zyn-RPF web — M2 dev harness</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1b1f24; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #e6e8eb; background: #14171a; } a { color: #7db7ff; } }
  .banner { border: 1px solid #b58900; background: rgba(181,137,0,.12); padding: .6rem .8rem; border-radius: 6px; }
  #status { min-height: 1.5em; margin: .8rem 0; }
  #status.error { color: #d1242f; }
  ul.tree { list-style: none; padding-left: 1.2rem; margin: 0; }
  #tree { padding-left: 0; }
  .meta { color: #6b7380; font-size: 13px; }
  button { font: inherit; padding: .35rem .8rem; }
</style>
</head>
<body>
<h1>Zyn-RPF web — M2 dev harness</h1>
<p class="banner">Developer test page for the M2 vertical slice. It is not the application UI (that is a later milestone).
Uploads live only in a temporary server workspace; download anything you want to keep.</p>
<p><input type="file" id="file" accept=".rpf"> <button id="open" type="button">Upload and open</button></p>
<div id="status" role="status"></div>
<div id="summary" class="meta"></div>
<ul class="tree" id="tree"></ul>
<p id="actions" hidden>
  <a id="export" href="#">Download re-serialized archive (verified)</a> ·
  <a id="original" href="#">Download original upload</a> ·
  <button id="close" type="button">Close document</button>
</p>
<script src="/dev.js"></script>
</body>
</html>
