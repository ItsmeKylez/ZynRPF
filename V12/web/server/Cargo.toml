[package]
name = "zyn-server"
version = "0.1.0"
edition = "2024"
description = "Web backend for Zyn-RPF (M2 vertical slice): workspace store + axum HTTP API over zyn-doc-engine."
license = "GPL-3.0-only"
publish = false

# New crates approved by the user for web/ only (D3, 2026-11-27). tower-http/zip are NOT added yet.
[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs"] }
zyn-doc-engine = { version = "0.1.0", path = "../doc-engine" }

[dev-dependencies]
http-body-util = "0.1.5"
tlk-rpf-core = { path = "../../core" }
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
